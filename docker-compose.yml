services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: netracare-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netracare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netracare}
      POSTGRES_DB: ${POSTGRES_DB:-netracare}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netracare} -d ${POSTGRES_DB:-netracare}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netracare

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netracare-backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-netracare}:${POSTGRES_PASSWORD:-netracare}@postgres:5432/${POSTGRES_DB:-netracare}
      - DATA_DIR=/app/data/data-pack-01
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Host-gateway lets the container reach a local Ollama (or any host
    # process) via host.docker.internal on Colima and Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - netracare

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netracare-frontend
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - netracare

  # Reserved for later iterations — uncomment when the iteration adds them.
  #
  # pgvector support is already shipped above (Postgres image is
  # pgvector/pgvector:pg16). Iter 3 just needs: CREATE EXTENSION vector;
  # and embedding columns. No new service required.
  #
  # langfuse:          # Iteration 5 — LLM observability
  #   image: langfuse/langfuse:latest
  #   ports:
  #     - "3100:3000"
  #   networks:
  #     - netracare
  #
  # mcp-server:        # Iteration 6 — partner app access
  #   build:
  #     context: ./mcp_server
  #   ports:
  #     - "8200:8200"
  #   networks:
  #     - netracare

volumes:
  postgres-data:

networks:
  netracare:
    driver: bridge
